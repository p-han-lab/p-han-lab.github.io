<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
<title id="title">Microbial sources and consumption of nitrous oxide</title>
<desc id="desc">Nitrification-associated reactions can form nitrous oxide through biological and abiotic routes. Denitrification proceeds from nitrate to nitrite, nitric oxide, nitrous oxide and nitrogen gas. Nar/Nap, Nir, Nor and NosZ denote nitrate, nitrite, nitric oxide and nitrous oxide reductases. NosZ provides a biological sink for nitrous oxide; arrows do not encode rates.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#315d78" stroke-width="1.3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#3d7566" stroke-width="1.3"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#976345" stroke-width="1.3"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#647278" stroke-width="1.3"/></marker></defs>
<rect width="600" height="340" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="23" y="30" text-anchor="start" font-size="21" fill="#315d78" font-weight="600">Nitrification-associated sources</text><text x="70" y="90" text-anchor="middle" font-size="25" fill="#315d78" font-weight="600">NH₃</text><text x="270" y="90" text-anchor="middle" font-size="25" fill="#315d78" font-weight="600">NH₂OH</text><text x="522" y="90" text-anchor="middle" font-size="25" fill="#315d78" font-weight="600">NO₂⁻</text><path d="M110 81H219" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M325 81H478" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="165" y="66" text-anchor="middle" font-size="17" fill="#647278">AMO</text><text x="405" y="66" text-anchor="middle" font-size="17" fill="#647278">Oxidation</text><path d="M270 105V144H423V219" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="5 5"/><text x="316" y="171" text-anchor="middle" font-size="18" fill="#315d78">Biotic / abiotic</text><text x="316" y="191" text-anchor="middle" font-size="18" fill="#315d78">N₂O formation</text><path d="M23 127H200" fill="none" stroke="#d6dedf" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="157" text-anchor="start" font-size="21" fill="#976345" font-weight="600">Denitrification</text><text x="66" y="252" text-anchor="middle" font-size="25" fill="#976345" font-weight="600">NO₃⁻</text><text x="181" y="252" text-anchor="middle" font-size="25" fill="#976345" font-weight="600">NO₂⁻</text><text x="296" y="252" text-anchor="middle" font-size="25" fill="#976345" font-weight="600">NO</text><text x="423" y="252" text-anchor="middle" font-size="25" fill="#976345" font-weight="600">N₂O</text><text x="542" y="252" text-anchor="middle" font-size="25" fill="#3d7566" font-weight="600">N₂</text><path d="M105 243H141" fill="none" stroke="#976345" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="123.0" y="283" text-anchor="middle" font-size="16" fill="#976345">Nar/Nap</text><path d="M221 243H269" fill="none" stroke="#976345" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="245.0" y="283" text-anchor="middle" font-size="16" fill="#976345">Nir</text><path d="M320 243H385" fill="none" stroke="#976345" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/><text x="352.5" y="283" text-anchor="middle" font-size="16" fill="#976345">Nor</text><path d="M462 243H515" fill="none" stroke="#3d7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="488.5" y="283" text-anchor="middle" font-size="16" fill="#3d7566">NosZ</text><path d="M423 218V188H524V128" fill="none" stroke="#647278" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)"/><text x="524" y="116" text-anchor="middle" font-size="18" fill="#647278">Air</text><text x="300" y="323" text-anchor="middle" font-size="18" fill="#647278">Net emissions reflect production and consumption</text>
