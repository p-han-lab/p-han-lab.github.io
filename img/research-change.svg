<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
<title id="title">Environmental gradients and microbial nitrogen-cycle measurements</title>
<desc id="desc">Environmental drivers affect microbial nitrogen transformations in water and sediment or soil. An oxygen gradient and representative microplastic fragments are shown schematically. Isotope tracing, multi-omics and process-rate assays connect communities with function. This does not show measured rates or a universal response direction.</desc>
