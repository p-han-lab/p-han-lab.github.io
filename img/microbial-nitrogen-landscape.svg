<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
<title id="title">Microbial nitrogen cycling across environments</title><desc id="desc">An original conceptual illustration connecting soils, polar landscapes and coastal waters to a magnified microbial community. Ammonium, nitrite and nitrate mark the nitrification sequence. The drawing is illustrative, not a micrograph.</desc>
