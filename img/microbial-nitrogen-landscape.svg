<linearGradient id="ocean" x2="0" y2="1"><stop stop-color="#80c7d0"/><stop offset="1" stop-color="#164f70"/></linearGradient>
<linearGradient id="soil" x2="0" y2="1"><stop stop-color="#b0c8ae"/><stop offset="1" stop-color="#355d58"/></linearGradient>
<radialGradient id="lens"><stop stop-color="#e6f7f1"/><stop offset=".8" stop-color="#a1d4c7"/><stop offset="1" stop-color="#448e89"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#497b7e" opacity=".1"/></pattern>
</defs><rect width="500" height="500" rx="16" fill="#f0f7f6"/><rect width="500" height="500" rx="16" fill="url(#dots)"/>
