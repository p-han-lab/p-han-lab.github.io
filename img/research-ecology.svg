<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Microbial strategies for nitrification</title><desc id="desc">Canonical nitrification uses ammonia-oxidizing archaea or bacteria (AOA/AOB), followed by nitrite-oxidizing bacteria (NOB). Comammox Nitrospira performs both steps in one organism.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#527b87" stroke-width="1.4"/></marker>
<linearGradient id="ocean" x2="0" y2="1"><stop stop-color="#80c7d0"/><stop offset="1" stop-color="#164f70"/></linearGradient>
<linearGradient id="soil" x2="0" y2="1"><stop stop-color="#b0c8ae"/><stop offset="1" stop-color="#355d58"/></linearGradient>
<radialGradient id="lens"><stop stop-color="#e6f7f1"/><stop offset=".8" stop-color="#a1d4c7"/><stop offset="1" stop-color="#448e89"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#497b7e" opacity=".1"/></pattern>
</defs><rect width="600" height="360" rx="16" fill="#f2f8f4"/><rect width="600" height="360" rx="16" fill="url(#dots)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="40" text-anchor="middle" fill="#243e4a" font-size="27" font-weight="600">Two strategies for nitrification</text><rect x="20" y="58" width="560" height="139" rx="12" fill="#fff"/><text x="85" y="143" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NH₄⁺</text><text x="300" y="143" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NO₂⁻</text><text x="515" y="143" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NO₃⁻</text><path d="M140 135H245" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M355 135H460" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(193 89) rotate(0) scale(0.55)"><rect x="-38" y="-17" width="76" height="34" rx="17" fill="#267f79"/><rect x="-33" y="-12" width="66" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".45"/><path d="M-22 0q6-10 12 0t12 0t12 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-24" cy="7" r="2" fill="#fff" opacity=".55"/><circle cx="23" cy="-6" r="2" fill="#fff" opacity=".55"/><circle cx="12" cy="8" r="2" fill="#fff" opacity=".55"/><circle cx="-7" cy="-7" r="2" fill="#fff" opacity=".55"/></g><g transform="translate(409 89) rotate(0) scale(0.55)"><rect x="-38" y="-17" width="76" height="34" rx="17" fill="#5770a0"/><rect x="-33" y="-12" width="66" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".45"/><path d="M-22 0q6-10 12 0t12 0t12 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-24" cy="7" r="2" fill="#fff" opacity=".55"/><circle cx="23" cy="-6" r="2" fill="#fff" opacity=".55"/><circle cx="12" cy="8" r="2" fill="#fff" opacity=".55"/><circle cx="-7" cy="-7" r="2" fill="#fff" opacity=".55"/></g><text x="193" y="181" text-anchor="middle" fill="#243e4a" font-size="22" font-weight="400">AOA / AOB</text><text x="409" y="181" text-anchor="middle" fill="#243e4a" font-size="22" font-weight="400">NOB</text><rect x="20" y="213" width="560" height="127" rx="12" fill="#e1f0e9" stroke="#b4d4c4"/><text x="300" y="249" text-anchor="middle" fill="#243e4a" font-size="25" font-weight="600">Comammox Nitrospira</text><text x="88" y="297" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NH₄⁺</text><text x="300" y="297" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NO₂⁻</text><text x="514" y="297" text-anchor="middle" fill="#243e4a" font-size="31" font-weight="400">NO₃⁻</text><path d="M146 289H244" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M357 289H456" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>