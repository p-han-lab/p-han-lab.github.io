<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
<title id="title">Enzymatic organization of nitrification</title>
<desc id="desc">Top: ammonia-oxidizing bacteria (AOB) and nitrite-oxidizing bacteria (NOB) divide the two nitrification steps. Bottom: comammox Nitrospira combines both. AMO: ammonia monooxygenase; HAO: hydroxylamine oxidoreductase; NXR: nitrite oxidoreductase. The ammonia-oxidizing archaeal pathway differs and is not depicted.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#315d78" stroke-width="1.3"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#3d7566" stroke-width="1.3"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#976345" stroke-width="1.3"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#647278" stroke-width="1.3"/></marker></defs>
<rect width="600" height="340" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="30" text-anchor="start" font-size="21" fill="#315d78" font-weight="600">Division of labour</text><rect x="23" y="51" width="330" height="111" rx="22" fill="#f5f7f7" stroke="#a3b9c4" stroke-width="1.3"/><rect x="29" y="57" width="318" height="99" rx="17" fill="none" stroke="#c3d2d9" stroke-width="1.3"/><rect x="386" y="51" width="190" height="111" rx="22" fill="#f5f7f7" stroke="#a3b9c4" stroke-width="1.3"/><rect x="392" y="57" width="178" height="99" rx="17" fill="none" stroke="#c3d2d9" stroke-width="1.3"/><text x="188" y="78" text-anchor="middle" font-size="18" fill="#647278" font-weight="600">AOB</text><text x="481" y="78" text-anchor="middle" font-size="18" fill="#647278" font-weight="600">NOB</text><text x="70" y="118" text-anchor="middle" font-size="23" fill="#315d78">NH₃</text><text x="187" y="118" text-anchor="middle" font-size="23" fill="#315d78">NH₂OH</text><text x="305" y="118" text-anchor="middle" font-size="23" fill="#315d78">NO₂⁻</text><text x="422" y="118" text-anchor="middle" font-size="23" fill="#315d78">NO₂⁻</text><text x="541" y="118" text-anchor="middle" font-size="23" fill="#315d78">NO₃⁻</text><path d="M103 110H142" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="122.5" y="144" text-anchor="middle" font-size="16" fill="#647278">AMO</text><path d="M237 110H265" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="251.0" y="144" text-anchor="middle" font-size="16" fill="#647278">HAO</text><path d="M458 110H501" fill="none" stroke="#315d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="479.5" y="144" text-anchor="middle" font-size="16" fill="#647278">NXR</text><path d="M354 107H383" fill="none" stroke="#647278" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gray)" stroke-dasharray="5 5"/><text x="24" y="196" text-anchor="start" font-size="21" fill="#3d7566" font-weight="600">Complete nitrification in one organism</text><rect x="23" y="215" width="553" height="102" rx="22" fill="#f6f9f8" stroke="#a3beb5" stroke-width="1.3"/><rect x="29" y="221" width="541" height="90" rx="17" fill="none" stroke="#cadbd6" stroke-width="1.3"/><text x="300" y="242" text-anchor="middle" font-size="18" fill="#3d7566" font-style="italic">Comammox Nitrospira</text><text x="76" y="275" text-anchor="middle" font-size="24" fill="#3d7566">NH₃</text><text x="225" y="275" text-anchor="middle" font-size="24" fill="#3d7566">NH₂OH</text><text x="391" y="275" text-anchor="middle" font-size="24" fill="#3d7566">NO₂⁻</text><text x="529" y="275" text-anchor="middle" font-size="24" fill="#3d7566">NO₃⁻</text><path d="M112 266H176" fill="none" stroke="#3d7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="144.0" y="297" text-anchor="middle" font-size="16" fill="#647278">AMO</text><path d="M272 266H351" fill="none" stroke="#3d7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="311.5" y="297" text-anchor="middle" font-size="16" fill="#647278">HAO</text><path d="M430 266H492" fill="none" stroke="#3d7566" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="461.0" y="297" text-anchor="middle" font-size="16" fill="#647278">NXR</text>
</g></svg>
