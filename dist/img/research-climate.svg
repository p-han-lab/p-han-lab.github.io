<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Microbial controls on nitrous oxide emissions</title><desc id="desc">Nitrification and denitrification can produce nitrous oxide. Nitrous oxide can be emitted to the atmosphere or reduced by microorganisms to nitrogen gas. Arrows are conceptual and do not represent relative rates.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#527b87" stroke-width="1.4"/></marker>
<linearGradient id="ocean" x2="0" y2="1"><stop stop-color="#80c7d0"/><stop offset="1" stop-color="#164f70"/></linearGradient>
<linearGradient id="soil" x2="0" y2="1"><stop stop-color="#b0c8ae"/><stop offset="1" stop-color="#355d58"/></linearGradient>
<radialGradient id="lens"><stop stop-color="#e6f7f1"/><stop offset=".8" stop-color="#a1d4c7"/><stop offset="1" stop-color="#448e89"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#497b7e" opacity=".1"/></pattern>
</defs><rect width="600" height="360" rx="16" fill="#fcf5f1"/><rect width="600" height="360" rx="16" fill="url(#dots)"/>
