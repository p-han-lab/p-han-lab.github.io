<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Environmental change and microbial nitrogen cycling</title><desc id="desc">Warming, low oxygen, acidification, and microplastics act on microbes in coastal waters and sediments. These pressures can alter communities, activity, and nitrogen flux; effects depend on context.</desc>
