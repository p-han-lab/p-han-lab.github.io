<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Nitrogen removal and micropollutant biotransformation</title><desc id="desc">Top: partial nitritation supplies nitrite, which anammox uses with ammonium to form nitrogen gas. Bottom: a separate approach uses ammonia oxidizers to transform selected micropollutants. Transformation does not necessarily mean complete mineralization.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#527b87" stroke-width="1.4"/></marker>
<linearGradient id="ocean" x2="0" y2="1"><stop stop-color="#80c7d0"/><stop offset="1" stop-color="#164f70"/></linearGradient>
<linearGradient id="soil" x2="0" y2="1"><stop stop-color="#b0c8ae"/><stop offset="1" stop-color="#355d58"/></linearGradient>
<radialGradient id="lens"><stop stop-color="#e6f7f1"/><stop offset=".8" stop-color="#a1d4c7"/><stop offset="1" stop-color="#448e89"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#497b7e" opacity=".1"/></pattern>
</defs><rect width="600" height="360" rx="16" fill="#f1f7fb"/><rect width="600" height="360" rx="16" fill="url(#dots)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="40" text-anchor="middle" fill="#243e4a" font-size="27" font-weight="600">Microbial pathways for cleaner water</text><rect x="20" y="60" width="560" height="145" rx="12" fill="#fff"/><text x="85" y="116" text-anchor="middle" fill="#243e4a" font-size="29" font-weight="400">NH₄⁺</text><text x="300" y="116" text-anchor="middle" fill="#243e4a" font-size="29" font-weight="400">NO₂⁻</text><text x="516" y="116" text-anchor="middle" fill="#243e4a" font-size="29" font-weight="400">N₂</text><path d="M145 108H240" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M360 108H470" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="190" y="151" text-anchor="middle" fill="#243e4a" font-size="21" font-weight="400">Partial</text><text x="190" y="177" text-anchor="middle" fill="#243e4a" font-size="21" font-weight="400">nitritation</text><text x="420" y="151" text-anchor="middle" fill="#243e4a" font-size="21" font-weight="400">Anammox</text><text x="420" y="177" text-anchor="middle" fill="#243e4a" font-size="21" font-weight="400">+ NH₄⁺</text><rect x="20" y="222" width="560" height="118" rx="12" fill="#dcebf3"/><text x="300" y="256" text-anchor="middle" fill="#243e4a" font-size="25" font-weight="600">Micropollutant biotransformation</text><g stroke="#647e9f" stroke-width="3" fill="none"><path d="M55 295l17-10 17 10v20l-17 10-17-10zM89 295h21l11 17"/></g><path d="M145 306H228" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(300 306) rotate(0) scale(1.1)"><rect x="-38" y="-17" width="76" height="34" rx="17" fill="#287e91"/><rect x="-33" y="-12" width="66" height="24" rx="12" fill="none" stroke="#fff" stroke-opacity=".45"/><path d="M-22 0q6-10 12 0t12 0t12 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-24" cy="7" r="2" fill="#fff" opacity=".55"/><circle cx="23" cy="-6" r="2" fill="#fff" opacity=".55"/><circle cx="12" cy="8" r="2" fill="#fff" opacity=".55"/><circle cx="-7" cy="-7" r="2" fill="#fff" opacity=".55"/></g><path d="M370 306H452" fill="none" stroke="#4b7b89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g fill="#567c99"><circle cx="490" cy="298" r="8"/><circle cx="529" cy="314" r="8"/><circle cx="504" cy="323" r="5"/></g></g></svg>